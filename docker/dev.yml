# Local panel for design work. There is no Wings daemon here, so the server
# screens have no websocket and the daemon backed endpoints return errors;
# auth, the dashboard, the account area and the admin area all work.
#
#   docker compose -f docker/dev.yml up -d
#   docker compose -f docker/dev.yml exec panel composer install
#   docker compose -f docker/dev.yml exec panel php artisan migrate --seed --force
#   docker compose -f docker/dev.yml exec panel php artisan p:user:make
#
# The assets are built on the host: `yarn watch`.
services:
  database:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: latte
      MARIADB_DATABASE: panel
      MARIADB_USER: pterodactyl
      MARIADB_PASSWORD: latte
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  cache:
    image: redis:alpine
    restart: unless-stopped

  panel:
    build:
      context: ..
      dockerfile: docker/dev.Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ..:/app
      # Composer writes thousands of small files; keeping them off the bind
      # mount is the difference between seconds and minutes on Windows.
      - vendor:/app/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: "base64:ptu/Ageijp7FCAtPNNY2MOLrOxugcxrZBkQ646CfwC0="
      APP_URL: http://localhost:8000
      APP_TIMEZONE: UTC
      APP_ENVIRONMENT_ONLY: "false"
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: "3306"
      DB_DATABASE: panel
      DB_USERNAME: pterodactyl
      DB_PASSWORD: latte
      REDIS_HOST: cache
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      # There is no public domain here for Google to verify against, so the
      # captcha middleware would fail before the credentials are ever checked.
      RECAPTCHA_ENABLED: "false"
      HASHIDS_SALT: latte-dev
      HASHIDS_LENGTH: "8"

volumes:
  database:
  vendor:
